name: one-rag

services:
  api:
    build: .
    command: uv run --frozen --no-sync uvicorn one_rag.api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-one_rag}:${POSTGRES_PASSWORD:-one_rag_dev_password}@postgres:5432/${POSTGRES_DB:-one_rag}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8000:8000"]
    volumes:
      - ./src:/app/src
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      qdrant: {condition: service_started}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-one_rag}
      POSTGRES_USER: ${POSTGRES_USER:-one_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-one_rag_dev_password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: redpandadata/redpanda:v24.3.6
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092", "--advertise-kafka-addr", "PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092"]
    ports: ["19092:19092"]
    volumes: ["kafka_data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  kafka_data:
