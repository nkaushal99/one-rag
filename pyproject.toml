[project]
name = "one-rag"
version = "0.1.0"
description = "A minimal RAG retrieval pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "redis>=5.2,<6",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
retrieval = [
    "fastembed>=0.5,<1",
    "langchain>=0.3,<0.4",
    "langchain-google-genai>=2,<3",
    "qdrant-client>=1.12,<1.13",
    "ragas>=0.2,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
